[project]
name = "direct"
version = "0.1.0"
description = "Quick directory navigation and path shortcut manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
direct = "direct.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/KhornVictor/DirectV2"

[tool.pytest.ini_options]
pythonpath = ["src"]
